[project]
name = "project-cyclic"
version = "0.1.0"
description = "Self-healing code execution agent: LLM-generated Python run in a hardened Docker sandbox with automatic retry."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.0.0",
    "docker>=7.1.0",
    "filelock>=3.13",
    "litellm>=1.80.5",
    "loguru>=0.7.3",
    "python-dotenv>=1.2.1",
    "rich>=13.0",
    "tenacity>=8.2.0",
    "typer>=0.20.0",
]

[project.scripts]
cyclic = "cyclic.main:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cyclic*"]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
